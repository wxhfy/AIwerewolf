name: Release Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-images-${{github.ref}}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{github.repository_owner}}

jobs:
  publish:
    name: Publish production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{env.REGISTRY}}/${{env.IMAGE_NAMESPACE}}/aiwerewolf-backend
            ${{env.REGISTRY}}/${{env.IMAGE_NAMESPACE}}/aiwerewolf-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{github.ref == 'refs/heads/main'}}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write deployment summary
        run: |
          {
            echo '### Published images'
            echo ''
            echo '- ghcr.io/${{github.repository_owner}}/aiwerewolf-backend:sha-${{github.sha}}'
            echo '- ghcr.io/${{github.repository_owner}}/aiwerewolf-frontend:sha-${{github.sha}}'
          } >> "$GITHUB_STEP_SUMMARY"
