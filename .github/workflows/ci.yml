name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  _TEST_ALLOW_FAKE_LLM: "true"
  LLM_PROVIDER: fake
  AIWEREWOLF_SKIP_DOTENV: "true"
  AIWEREWOLF_STRICT_MODE: "true"

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check backend/ tests/ configs/ scripts/

  test:
    name: Backend tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: >-
          python -m pytest tests/ -q --timeout=120
          --ignore=tests/test_b_full_acceptance.py
          --ignore=tests/test_c_acceptance_verification.py
          --ignore=tests/test_track_b_badcase_regression.py

  frontend:
    name: Frontend lint and build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose contract
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Validate backend image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aiwerewolf/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate frontend image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: aiwerewolf/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
